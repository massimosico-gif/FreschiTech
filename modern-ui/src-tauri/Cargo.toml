[package]
name = "app"
version = "1.0.0"
description = "FreschiTech App"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.1.0"
tauri-plugin-updater = "2"
# `backup`: API di backup online di SQLite, che copia il database in modo
# consistente anche se qualcuno sta scrivendo (a differenza di fs::copy).
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
directories = "5.0"
calamine = "0.24"
# Usato per la diagnostica su Telegram: sostituisce le chiamate al binario
# esterno `curl`, che non e' garantito su Windows.
reqwest = { version = "0.13", features = ["blocking", "multipart", "json"] }
