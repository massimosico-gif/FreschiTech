[package]
name = "app"
version = "1.0.0"
description = "FreschiTech App"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
# Incorpora i segreti locali nel binario (vedi build.rs).
tecno-core-build = { git = "https://github.com/massimosico-gif/TauriKit", package = "tecno-core-build" }

[dependencies]
# Infrastruttura condivisa: database, migrazioni, backup, log, diagnostica.
# Una correzione fatta li' arriva a questa applicazione senza ricopiare codice.
#
# PERCHE' UN PERCORSO ASSOLUTO E NON "../../../TauriKit/..."
# ---------------------------------------------------------
# Il percorso relativo si risolve rispetto a questo file, quindi si rompe in un
# git worktree: da `.claude/worktrees/<nome>/modern-ui/src-tauri` tre livelli
# piu' su non c'e' nessuna cartella TauriKit, e la compilazione fallisce senza
# che il motivo sia evidente.
#
# Su un'altra macchina va sostituito con la dipendenza git:
#   tecno-core = { git = "https://github.com/massimosico-gif/TauriKit", package = "tecno-core", features = ["comuni"] }
# Il repository e' privato: serve che cargo possa autenticarsi (chiave SSH,
# oppure `net.git-fetch-with-cli = true` con le credenziali gia' in cache).
tecno-core = { git = "https://github.com/massimosico-gif/TauriKit", package = "tecno-core", features = ["comuni"] }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.1.0"
tauri-plugin-updater = "2"
directories = "5.0"
calamine = "0.24"

# SQLCipher ha bisogno di un fornitore di crittografia, e non e' lo stesso sulle
# due piattaforme: su macOS c'e' CommonCrypto nel sistema, su Windows serve
# OpenSSL compilata da sorgente per poterla legare STATICAMENTE.
#
# Queste due sezioni ricalcano quelle di `tecno-core`. Sono qui perche' anche
# `db.rs` e `commands.rs` usano rusqlite direttamente, e cargo unifica le
# feature: una riga senza distinzione di piattaforma funzionerebbe comunque,
# ma sarebbe una seconda dichiarazione capace di divergere da quella condivisa.
#
# NON impostare OPENSSL_DIR per aggirare la compilazione: fa passare
# libsqlite3-sys al collegamento dinamico, e il pacchetto parte sulla macchina
# di sviluppo ma non su quelle dei clienti, che quella libreria non ce l'hanno.
# Vale in particolare qui, che si distribuisce solo su Windows.
[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher", "backup"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
